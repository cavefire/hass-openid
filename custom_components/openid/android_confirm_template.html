<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm sign in</title>
    <link rel="stylesheet" href="/openid/style.css" />
  </head>
  <body>
    <div class="page-card">
      <h1>Confirm sign in</h1>
      <p class="message">You are signing in to the Home Assistant Android app as <strong>$username</strong>.</p>
      <div class="warning">Only continue if you started this sign-in yourself, in the Home Assistant app on your own device. If someone sent you a link to this page, close it.</div>
      <form method="post" action="/auth/openid/callback">
        <input type="hidden" name="confirm" value="$confirm" />
        <div class="actions">
          <button type="submit" class="btn-authorize">Continue</button>
        </div>
      </form>
    </div>
  </body>
</html>
